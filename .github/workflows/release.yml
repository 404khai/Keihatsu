# Validation only. Baseline publication/distribution is an explicit local action.
name: Shorebird baseline validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Flutter platform to validate (no upload)
        required: true
        type: choice
        options: [android, ios]
      architecture:
        description: Android APK architectures
        required: true
        type: choice
        default: universal
        options: [universal, arm64]

permissions:
  contents: read

concurrency:
  group: shorebird-validation-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/flutter
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed build pins
        id: settings
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          settings = json.loads(Path('shorebird-release.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('flutter_version=' + settings['flutter_version'] + '\n')
              for name in ['navii', 'blobatar']:
                  output.write(name + '_revision=' + settings['path_dependencies'][name]['revision'] + '\n')
          PYTHON
      # Keep path dependencies at reviewed commits; never build floating main.
      - uses: actions/checkout@v4
        with:
          repository: 404khai/navii
          ref: ${{ steps.settings.outputs.navii_revision }}
          path: .ota-deps/navii
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: 404khai/blobatar
          ref: ${{ steps.settings.outputs.blobatar_revision }}
          path: .ota-deps/blobatar
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - name: Link sibling path packages
        run: |
          ln -s "$GITHUB_WORKSPACE/.ota-deps/navii" "$GITHUB_WORKSPACE/../navii"
          ln -s "$GITHUB_WORKSPACE/.ota-deps/blobatar" "$GITHUB_WORKSPACE/../blobatar"
      - name: Check project and account prerequisites
        run: |
          test -f shorebird.yaml || { echo 'Initialize Shorebird locally and commit the real app ID first.'; exit 1; }
          test -n "$SHOREBIRD_TOKEN" || { echo 'Configure SHOREBIRD_TOKEN as a repository Actions secret (Shorebird API key).'; exit 1; }
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.settings.outputs.flutter_version }}
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Restore Android signing and Firebase configuration
        if: inputs.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYTHON'
          import os, base64
          from pathlib import Path
          required = ['KEYSTORE_BASE64', 'KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD', 'GOOGLE_SERVICES_JSON']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configure the existing Android signing and Firebase Actions secrets before validation.')
          def write(path, data):
              path.write_bytes(data)
              path.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          write(Path('android/app/upload-keystore.jks'), base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
          properties = [('storeFile', 'upload-keystore.jks'), ('keyAlias', os.environ['KEY_ALIAS']),
                        ('keyPassword', os.environ['KEY_PASSWORD']), ('storePassword', os.environ['STORE_PASSWORD'])]
          write(Path('android/key.properties'), ''.join(f'{key}={escape(value)}\n' for key, value in properties).encode())
          write(Path('android/app/google-services.json'), os.environ['GOOGLE_SERVICES_JSON'].encode())
          PYTHON
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Validate OTA diagnostics and release guards
        run: |
          flutter test --no-pub test/services/ota_diagnostics_test.dart
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Validate Android Shorebird baseline (no upload)
        if: inputs.platform == 'android'
        env:
          OTA_ARCH: ${{ inputs.architecture }}
        run: python3 tool/shorebird.py release android --arch "$OTA_ARCH"
      - name: Validate Flutter iOS Shorebird archive (unsigned, no upload)
        if: inputs.platform == 'ios'
        run: python3 tool/shorebird.py release ios --no-codesign
      - name: Retain local validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-${{ inputs.platform }}-validation-receipt
          path: apps/flutter/build/shorebird/keihatsu-*-validated.json
          if-no-files-found: error
      - name: Remove signing secrets from runner
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks android/app/google-services.json
